{% extends "base.html" %}
{% block content %}
<div class="max-w-xl mx-auto bg-white p-8 rounded-lg shadow">
    <h1 class="text-2xl font-bold mb-6 text-slate-800">Criar Novo Pedido</h1>
    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-700">Cliente</label>
            <select name="cliente_id" required class="mt-1 block w-full rounded-md border-slate-300 shadow-sm border p-2">
                <option value="">Selecione o cliente...</option>
                {% for c in clientes %}
                <option value="{{ c.id }}">{{ c.nome }} ({{ c.telefone }})</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700">Data do Pedido</label>
            <input type="date" name="data_pedido" required class="mt-1 block w-full rounded-md border-slate-300 shadow-sm border p-2">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700">Produto</label>
            <select name="produto_id" required class="mt-1 block w-full rounded-md border-slate-300 shadow-sm border p-2">
                <option value="">Selecione o produto...</option>
                {% for p in produtos %}
                <option value="{{ p.id }}">[{{ p.codigo }}] {{ p.descricao }} - Venda: R$ {{ "%.2f"|format(p.valor_venda) }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-slate-700">Quantidade</label>
                <input type="number" name="quantidade" value="1" min="1" required class="mt-1 block w-full rounded-md border-slate-300 shadow-sm border p-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700">Valor Unitário (R$)</label>
                <input type="number" step="0.01" name="valor_unitario" required class="mt-1 block w-full rounded-md border-slate-300 shadow-sm border p-2" placeholder="Ex: 87.99">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700">Quantidade de Parcelas</label>
            <select name="qtd_parcelas" required class="mt-1 block w-full rounded-md border-slate-300 shadow-sm border p-2">
                <option value="1">1x</option>
                <option value="2">2x</option>
                <option value="3" selected>3x (5º dia útil)</option>
                <option value="4">4x</option>
                <option value="5">5x</option>
                <option value="6">6x</option>
            </select>
        </div>

        <button type="submit" class="w-full bg-purple-600 text-white py-3 rounded-lg hover:bg-purple-700 font-bold shadow">Salvar Pedido e Gerar Parcelas</button>
    </form>
</div>
{% endblock %}
