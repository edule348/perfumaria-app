<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Pedidos - Perfumaria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen font-sans">
    <nav class="bg-purple-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/" class="text-xl font-bold flex items-center gap-2"><i class="fa-solid fa-pump-soap"></i> Perfumaria Gestão</a>
            <div class="space-x-4">
                <a href="/" class="hover:underline">Pedidos</a>
                <a href="/produtos" class="hover:underline">Produtos</a>
                <a href="/clientes" class="hover:underline">Clientes</a>
                <a href="/pedido/novo" class="bg-purple-800 px-3 py-1.5 rounded-lg shadow hover:bg-purple-900">+ Novo Pedido</a>
            </div>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-4 py-6">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="mb-4 p-4 rounded-lg bg-green-100 text-green-700 border border-green-300">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
